<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lletra lligada</title>
<style>
:root{
  --bg:#FFF8EE; --ink:#3B3355; --muted:#8A829E; --card:#FFFFFF; --line:#EFE6D6;
  --ok:#2FBF71; --bad:#FF5A5F;
  --lv1:#FF6B6B; --lv2:#FF9F1C; --lv3:#2EC4B6; --lv4:#4D96FF; --lv5:#9B5DE5;
  --lv:#FF6B6B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none !important}

/* ---------- Joc ---------- */
#game{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{flex:0 0 auto;height:clamp(60px,9vh,96px);display:flex;align-items:center;gap:clamp(8px,1.4vw,20px);padding:0 clamp(10px,2vw,28px)}
.icon-btn{width:clamp(48px,6.5vh,72px);height:clamp(48px,6.5vh,72px);border-radius:50%;background:var(--card);
  display:grid;place-items:center;box-shadow:0 3px 0 rgba(59,51,85,.12);transition:transform .1s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:55%;height:55%;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#lvl-pill{background:var(--lv);color:#fff;font-weight:700;border-radius:999px;
  padding:.45em 1.1em;font-size:clamp(16px,2.4vh,26px);white-space:nowrap}
#dots{display:flex;gap:clamp(6px,1vw,12px);flex:1;justify-content:center}
.dot{width:clamp(16px,2.4vh,26px);height:clamp(16px,2.4vh,26px);border-radius:50%;background:var(--line);
  border:3px solid transparent;transition:background .2s}
.dot.done{background:var(--lv)}
.dot.cur{border-color:var(--ink)}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#pic{position:absolute;left:50%;top:0;transform:translateX(-50%);pointer-events:none;
  display:grid;place-items:center;line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif}
#pic span{display:block;filter:drop-shadow(0 6px 0 rgba(59,51,85,.08))}
#pic.bounce span{animation:bounce .9s ease}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}100%{transform:scale(1)}}
#toast{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:var(--card);
  padding:.6em 1.2em;border-radius:999px;font-size:clamp(16px,2.6vh,28px);font-weight:700;
  box-shadow:0 4px 0 rgba(59,51,85,.12);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

/* ---------- Pantalles superposades ---------- */
.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(14px,3vh,36px);padding:clamp(16px,3vw,40px);overflow:auto}
#title-cv{width:min(90vw,820px);height:clamp(110px,20vh,210px)}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,1.6vw,24px);width:min(96vw,1400px)}
.lv-card{background:var(--card);border-radius:28px;padding:clamp(14px,2.2vh,28px) 10px;display:flex;flex-direction:column;
  align-items:center;gap:clamp(6px,1.2vh,14px);box-shadow:0 6px 0 rgba(59,51,85,.10);transition:transform .12s}
.lv-card:active{transform:scale(.96)}
.lv-num{width:clamp(56px,9vh,96px);height:clamp(56px,9vh,96px);border-radius:50%;color:#fff;font-weight:800;
  font-size:clamp(28px,5vh,52px);display:grid;place-items:center}
.lv-name{font-weight:700;font-size:clamp(16px,2.4vh,26px)}
.lv-sub{color:var(--muted);font-size:clamp(13px,1.9vh,20px)}
.lv-emo{font-size:clamp(18px,3vh,34px);letter-spacing:2px;text-align:center;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.lv-prog{display:flex;gap:5px}
.lv-prog i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.big-btn{background:var(--ok);color:#fff;font-weight:800;font-size:clamp(20px,3.4vh,36px);
  padding:.55em 1.6em;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .1s}
.big-btn:active{transform:scale(.95)}
.big-btn.alt{background:var(--card);color:var(--ink)}
.seg{display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 3px 0 rgba(59,51,85,.08)}
.seg button{white-space:nowrap;padding:.5em 1.1em;border-radius:999px;font-weight:700;font-size:clamp(14px,2vh,20px);color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
#bar,#toast,.modal-box{zoom:var(--z,1)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 3px 0 rgba(59,51,85,.08)}
.stepper button{width:2.4em;height:2.4em;border-radius:50%;background:var(--bg);font-weight:800;font-size:clamp(16px,2.2vh,22px)}
.stepper button:disabled{opacity:.35}
.stepper span{min-width:4em;text-align:center;font-weight:800;font-size:clamp(16px,2.2vh,22px)}
.settings{display:flex;flex-direction:column;gap:clamp(10px,1.6vh,16px);align-items:center}
.small-link{color:var(--muted);text-decoration:underline;font-size:clamp(13px,1.8vh,18px)}
.lbl{color:var(--muted);font-weight:700;font-size:clamp(14px,2vh,20px)}

.modal{position:fixed;inset:0;background:rgba(59,51,85,.35);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--card);border-radius:36px;padding:clamp(22px,4vh,48px) clamp(22px,4vw,64px);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vh,22px);max-width:min(94vw,900px);
  box-shadow:0 10px 0 rgba(59,51,85,.12);animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-box h2{font-size:clamp(28px,5.5vh,60px)}
.modal-box p{font-size:clamp(18px,3vh,30px);color:var(--muted)}
.modal-emo{font-size:clamp(60px,12vh,130px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.stars{font-size:clamp(36px,7vh,76px);letter-spacing:.1em}
.stars .off{opacity:.18}

@media (max-width:820px){ .levels{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:520px){ .levels{grid-template-columns:repeat(2,minmax(0,1fr))} }
</style>
</head>
<body>

<!-- Pantalla de joc -->
<div id="game" class="hidden">
  <div id="bar">
    <button class="icon-btn" id="btn-home" aria-label="Menú">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
    </button>
    <div id="lvl-pill">Nivell 1</div>
    <div id="dots"></div>
    <button class="icon-btn" id="btn-prev" aria-label="Paraula anterior">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-btn" id="btn-redo" aria-label="Tornar a començar">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
    </button>
    <button class="icon-btn" id="btn-next" aria-label="Paraula següent">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button class="icon-btn" id="btn-size" aria-label="Mida del joc">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.6"/><circle cx="10" cy="17" r="2.6"/></svg>
    </button>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="pic"><span></span></div>
    <div id="toast"></div>
  </div>
</div>

<!-- Menú -->
<div id="menu" class="screen">
  <canvas id="title-cv"></canvas>
  <div class="levels" id="levels"></div>
  <div class="row">
    <button class="big-btn" id="btn-continue">Continuar</button>
  </div>
  <div id="menu-settings"></div>
  <div class="row">
    <span class="lbl">Camí:</span>
    <div class="seg" id="diff">
      <button data-d="easy">Ample</button>
      <button data-d="normal">Normal</button>
      <button data-d="hard">Estret</button>
    </div>
    <button class="small-link" id="btn-reset">Esborrar progrés</button>
  </div>
</div>

<!-- Finestra modal genèrica -->
<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

function pairs(a, dx) { const P = []; for (let i = 0; i < a.length; i += 2) P.push([a[i] + dx, a[i + 1]]); return P; }

// Enllaç que passa per sota del punt volat de la l·l
function dipPath(a, b) {
  const P = [], c1 = [a[0] + (b[0] - a[0]) * 0.25, 10], c2 = [a[0] + (b[0] - a[0]) * 0.75, 10];
  for (let k = 1; k <= 16; k++) {
    const t = k / 16, u = 1 - t;
    P.push([u*u*u*a[0] + 3*u*u*t*c1[0] + 3*u*t*t*c2[0] + t*t*t*b[0],
            u*u*u*a[1] + 3*u*u*t*c1[1] + 3*u*t*t*c2[1] + t*t*t*b[1]]);
  }
  return P;
}

/* Construeix una paraula: traços del cos (normalment un de sol, continu)
   + traços extra que es fan al final (punts, accents, creus...). */
function buildWord(word) {
  const body = [], extras = [];
  let cur = null, X = 0, li = 0, dip = false;
  const add = (pts, tag) => {
    for (const p of pts) {
      const L = cur.pts[cur.pts.length - 1];
      if (L && Math.abs(L[0] - p[0]) < 0.5 && Math.abs(L[1] - p[1]) < 0.5) continue;
      cur.pts.push(p); cur.tags.push(tag);
    }
  };
  for (const ch of [...word.normalize('NFC')]) {
    if (ch === '·') {
      const d = GL['·'];
      extras.push({ dot: [X + d.d[0], d.d[1]] });
      X += d.w; dip = true; continue;
    }
    const g = GL[ch];
    if (!g) throw new Error('Lletra sense definir: ' + ch);
    g.b.forEach((raw, si) => {
      let pts = pairs(raw, X);
      if (si === 0 && cur) {
        if (g.p) pts = pairs(g.p, X).concat(pts);
        if (dip) add(dipPath(cur.pts[cur.pts.length - 1], pts[0]), li);
        add(pts, li);
      } else {
        if (cur) body.push(cur);
        cur = { pts: [], tags: [] };
        add(pts, li);
      }
    });
    for (const e of g.x) extras.push(e.d ? { dot: [X + e.d[0], e.d[1]] } : { line: pairs(e.l, X) });
    X += g.w; li++; dip = false;
  }
  if (cur) body.push(cur);
  return { body, extras, nLetters: li };
}

function densify(pts, tags, step) {
  const xs = [], ys = [], tg = [];
  for (let i = 0; i < pts.length; i++) {
    if (i > 0) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step);
      for (let k = 1; k < n; k++) { xs.push(x0 + (x1 - x0) * k / n); ys.push(y0 + (y1 - y0) * k / n); tg.push(tags[i]); }
    }
    xs.push(pts[i][0]); ys.push(pts[i][1]); tg.push(tags[i]);
  }
  return { xs, ys, tags: tg };
}

  }
  let minX = Infinity, maxX = -Infinity;
  for (const s of strokes) for (const v of s.u.xs) { if (v < minX) minX = v; if (v > maxX) maxX = v; }
  return { word, strokes, minX, maxX, nLetters: w.nLetters };
}

/* Passa a píxels i calcula longituds acumulades */
function layoutStroke(st, u, ox, oy) {
  const n = st.u.xs.length;
  const X = new Float32Array(n), Y = new Float32Array(n), T = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    X[i] = ox + st.u.xs[i] * u; Y[i] = oy - st.u.ys[i] * u;
    T[i] = i ? T[i - 1] + Math.hypot(X[i] - X[i - 1], Y[i] - Y[i - 1]) : 0;
  }
  st.X = X; st.Y = Y; st.T = T; st.len = T[n - 1];
  if (st.kind === 'main') { // inici de cada lletra (en longitud de camí)
    const starts = [0], ends = [];
    for (let i = 1; i < n; i++) if (st.u.tags[i] !== st.u.tags[i - 1]) starts.push(T[i - 1]);
    for (let k = 1; k < starts.length; k++) ends.push(starts[k]);
    ends.push(st.len);
    st.letterStarts = starts; st.letterEnds = ends;
  }
}

function idxAt(st, t) { // primer índex amb T >= t
  let lo = 0, hi = st.T.length - 1;
  if (t <= 0) return 0;
  if (t >= st.T[hi]) return hi;
  while (lo < hi) { const m = (lo + hi) >> 1; if (st.T[m] < t) lo = m + 1; else hi = m; }
  return lo;
}
function pointAt(st, t) {
  const i = idxAt(st, t);
  if (i === 0 || st.T[i] === st.T[i - 1]) return [st.X[i], st.Y[i]];
  const f = (t - st.T[i - 1]) / (st.T[i] - st.T[i - 1]);
  return [st.X[i - 1] + (st.X[i] - st.X[i - 1]) * f, st.Y[i - 1] + (st.Y[i] - st.Y[i - 1]) * f];
}
function tracePath(ctx, st, from, to) {
  if (st.kind === 'dot') return;
  const i0 = idxAt(st, from), i1 = idxAt(st, to);
  const p0 = pointAt(st, from);
  ctx.moveTo(p0[0], p0[1]);
  for (let i = i0; i < i1; i++) if (st.T[i] > from) ctx.lineTo(st.X[i], st.Y[i]);
  const p1 = pointAt(st, to);
  ctx.lineTo(p1[0], p1[1]);
}

/* =====================================================================
   3. ESTAT I PERSISTÈNCIA
   ===================================================================== */
const STORE_KEY = 'lletraLligada.v1';
let save = { best: {}, pos: { lv: 0, i: 0 }, diff: 'normal', screen: null, zoom: 100 };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) save = Object.assign(save, JSON.parse(raw)); } catch (e) {}
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) {} }
const DIFF_K = { easy: 80, normal: 60, hard: 42 };

/* Tipus de pantalla: polzades de referència i mides físiques a 100%.
   xh = alçada de la lletra sense bucles (cm), pic = alçada de la imatge (cm).
   A la pissarra, cada lletra ocupa aproximadament una mà. */
const SCREENS = {
  pc:     { name: 'Ordinador',        inch: 22,   xh: 4,  pic: 6 },
  tablet: { name: 'Tauleta',          inch: 10.5, xh: 3,  pic: 4 },
  board:  { name: 'Pissarra digital', inch: 75,   xh: 13, pic: 24 },
};
const ZOOM_MIN = 50, ZOOM_MAX = 150, ZOOM_STEP = 10;
if (!SCREENS[save.screen]) {
  let coarse = false;
  try { coarse = matchMedia('(pointer: coarse)').matches; } catch (e) {}
  save.screen = coarse && Math.min(screen.width, screen.height) <= 1000 ? 'tablet' : 'pc';
}
save.zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round((+save.zoom || 100) / ZOOM_STEP) * ZOOM_STEP));
const zoomK = () => save.zoom / 100;
// Píxels CSS per centímetre, a partir de les polzades de la pantalla triada
function pxPerCm() {
  const diag = Math.hypot(screen.width || window.innerWidth, screen.height || window.innerHeight);
  return diag / (SCREENS[save.screen].inch * 2.54);
}

const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const stage = $('#stage'), pic = $('#pic'), toast = $('#toast');

const G = {
  lv: 0, wi: 0, model: null, stroke: 0, s: 0,
  drawing: false, blocked: false, pointer: null, last: null,
  errors: 0, done: false, u: 10, tol: 20, ink: 8,
  W: 0, H: 0, dpr: 1, picH: 0,
  shakeT: -1, fails: [], confetti: [], hintT: -1, idleSince: 0, letterFlash: -1,
};

/* =====================================================================
   4. DISPOSICIÓ A PANTALLA
   ===================================================================== */
function resize() {
  const r = stage.getBoundingClientRect();
  G.dpr = Math.min(window.devicePixelRatio || 1, 2);
  G.W = r.width; G.H = r.height;
  cv.width = Math.round(G.W * G.dpr); cv.height = Math.round(G.H * G.dpr);
  G.picH = Math.max(50, Math.min(G.H * 0.28, SCREENS[save.screen].pic * pxPerCm() * zoomK()));
  pic.style.height = G.picH + 'px';
  pic.querySelector('span').style.fontSize = (G.picH * 0.78) + 'px';
  if (G.model) layoutModel();
}

function layoutModel() {
  const m = G.model;
  const areaTop = G.picH, areaH = G.H - G.picH;
  const margin = Math.max(16, G.W * 0.05);
  const spanX = m.maxX - m.minX + 60;
  const vSpan = V_TOP - V_BOT;
  const uW = (G.W - 2 * margin) / spanX;
  const uH = (areaH * 0.94) / vSpan;
  const uT = SCREENS[save.screen].xh * pxPerCm() * zoomK() / XH;  // mida física desitjada
  const u = Math.max(0.08, Math.min(uW, uH, uT));
  G.u = u;
  const ox = (G.W - (m.maxX - m.minX) * u) / 2 - m.minX * u;
  const oy = areaTop + (areaH - vSpan * u) / 2 + V_TOP * u;
  G.ox = ox; G.oy = oy;
  for (const st of m.strokes) layoutStroke(st, u, ox, oy);
  G.tol = Math.max(18, Math.min(80, u * DIFF_K[save.diff]));
  G.ink = Math.max(6, u * 60);
}

/* =====================================================================
   5. CÀRREGA DE PARAULES I NAVEGACIÓ
   ===================================================================== */
function loadWord(lv, wi) {
  G.lv = lv; G.wi = wi;
  save.pos = { lv, i: wi }; persist();
  const [word, emoji] = LEVELS[lv].words[wi];
  G.model = wordModel(word);
  G.stroke = 0; G.s = 0; G.drawing = false; G.blocked = false; G.errors = 0; G.done = false;
  G.fails = []; G.confetti = []; G.idleSince = performance.now();
  document.documentElement.style.setProperty('--lv', LV_COLORS[lv]);
  $('#lvl-pill').textContent = 'Nivell ' + (lv + 1);
  pic.querySelector('span').textContent = emoji;
  pic.classList.remove('bounce');
  renderDots();
  resize();
}
function renderDots() {
  const box = $('#dots'); box.innerHTML = '';
  LEVELS[G.lv].words.forEach(([w], i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (save.best[w] ? ' done' : '') + (i === G.wi ? ' cur' : '');
    d.setAttribute('aria-label', 'Paraula ' + (i + 1));
    d.onclick = () => loadWord(G.lv, i);
    box.appendChild(d);
  });
}
function nextWord() {
  const words = LEVELS[G.lv].words;
  if (G.wi + 1 < words.length) return loadWord(G.lv, G.wi + 1);
  if (G.lv + 1 < LEVELS.length) return levelUp(G.lv + 1);
  finishAll();
}
function prevWord() {
  if (G.wi > 0) loadWord(G.lv, G.wi - 1);
  else if (G.lv > 0) loadWord(G.lv - 1, LEVELS[G.lv - 1].words.length - 1);
}

/* =====================================================================
   6. SEGUIMENT DEL DIT / RATOLÍ
   ===================================================================== */
const cur = () => G.model.strokes[G.stroke];

function startTol() { return G.tol * 1.5; }

function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

function tryStart(p) {
  if (G.done || G.blocked) return;
  const st = cur(), sp = pointAt(st, G.s);
  if (Math.hypot(p[0] - sp[0], p[1] - sp[1]) <= startTol()) {
    G.drawing = true; G.last = p; step(p);
  } else {
    G.hintT = performance.now();
  }
}

/* Busca el punt del camí més proper dins una finestra [s-B, s+A] */
function step(p) {
  const st = cur();
  if (st.kind === 'dot') { completeStroke(); return false; }
  const A = Math.max(G.tol * 1.3, 22), B = G.tol * 3;
  const i0 = idxAt(st, G.s - B), i1 = idxAt(st, G.s + A);
  let best = Infinity, fwD = Infinity, fwT = G.s;
  for (let i = i0; i <= i1; i++) {
    const d = Math.hypot(st.X[i] - p[0], st.Y[i] - p[1]);
    if (d < best) best = d;
    if (st.T[i] >= G.s && d < fwD - 0.75) { fwD = d; fwT = st.T[i]; }
  }
  const sp = pointAt(st, G.s);
  best = Math.min(best, Math.hypot(sp[0] - p[0], sp[1] - p[1]));
  if (best > G.tol) { fail(p); return false; }
  if (fwD <= G.tol && fwT > G.s) G.s = fwT;
  if (G.s >= st.len - Math.min(G.tol * 0.5, 10)) { G.s = st.len; completeStroke(); return false; }
  return true;
}

function feed(p) {
  if (!G.drawing) return;
  const q = G.last || p;
  const dist = Math.hypot(p[0] - q[0], p[1] - q[1]);
  const n = Math.max(1, Math.ceil(dist / Math.max(2, G.tol / 4)));
  for (let k = 1; k <= n; k++) {
    const t = k / n;
    if (!step([q[0] + (p[0] - q[0]) * t, q[1] + (p[1] - q[1]) * t])) break;
  }
  G.last = p;
}

function letterRange() {
  const st = cur();
  if (st.kind !== 'main') return [0, st.len];
  let k = 0;
  const S = st.letterStarts;
  for (let i = 0; i < S.length; i++) if (S[i] <= G.s + 0.01) k = i;
  if (k < S.length - 1 && G.s >= st.letterEnds[k] - 0.01) k++;
  return [S[k], st.letterEnds[k]];
}

function fail(p) {
  const st = cur();
  let from = 0;
  if (st.kind === 'main') {
    const S = st.letterStarts;
    for (let i = 0; i < S.length; i++) if (S[i] <= G.s) from = S[i];
  }
  G.fails.push({ stroke: G.stroke, from, to: G.s, t: performance.now(), x: p[0], y: p[1] });
  G.s = from; G.drawing = false; G.blocked = true; G.errors++;
  G.shakeT = performance.now();
  showToast('Ups! Torna-hi des del punt verd');
  if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) {}
}

function completeStroke() {
  G.drawing = false; G.blocked = true;
  G.stroke++; G.s = 0;
  if (G.stroke >= G.model.strokes.length) { G.stroke = G.model.strokes.length - 1; G.s = cur().len; wordDone(); }
}

cv.addEventListener('pointerdown', e => {
  if (G.pointer !== null || !G.model) return;
  e.preventDefault();
  G.pointer = e.pointerId; G.blocked = false;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  G.idleSince = performance.now();
  tryStart(evPos(e));
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== G.pointer) return;
  e.preventDefault();
  G.idleSince = performance.now();
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (list.length ? list : [e])) {
    const p = evPos(ev);
    if (!G.drawing && !G.blocked && !G.done) {
      const sp = pointAt(cur(), G.s);
      if (Math.hypot(p[0] - sp[0], p[1] - sp[1]) <= G.tol) { G.drawing = true; G.last = p; }
      continue;
    }
    feed(p);
  }
});
function release(e) {
  if (e.pointerId !== G.pointer) return;
  G.pointer = null; G.drawing = false; G.blocked = false; G.last = null;
  G.idleSince = performance.now();
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('lostpointercapture', release);

/* =====================================================================
   7. DIBUIX
   ===================================================================== */
function drawPauta(ctx) {
  const u = G.u, oy = G.oy, x0 = Math.max(12, G.W * 0.03), x1 = G.W - x0;
  ctx.fillStyle = 'rgba(77,150,255,0.07)';
  ctx.fillRect(x0, oy - XH * u, x1 - x0, XH * u);
  const line = (y, c, w, dash) => {
    ctx.beginPath(); ctx.setLineDash(dash || []); ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  };
  line(oy - ASC * u, 'rgba(59,51,85,0.10)', 2, [8, 8]);
  line(oy - XH * u, 'rgba(77,150,255,0.45)', 2);
  line(oy, 'rgba(59,51,85,0.45)', 3);
  line(oy - DESC * u, 'rgba(59,51,85,0.10)', 2, [8, 8]);
  ctx.setLineDash([]);
}

function strokeRange(st, from, to, color, width) {
  ctx.beginPath(); tracePath(ctx, st, from, to);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
}
function dotAt(x, y, r, color) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }

function drawArrow(x, y, ang, size, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.beginPath(); ctx.moveTo(size, 0); ctx.lineTo(-size * 0.6, -size * 0.7); ctx.lineTo(-size * 0.25, 0); ctx.lineTo(-size * 0.6, size * 0.7); ctx.closePath();
  ctx.fillStyle = color; ctx.fill(); ctx.restore();
}

function render(now) {
  requestAnimationFrame(render);
  if (!G.model || $('#game').classList.contains('hidden')) return;
  const m = G.model, u = G.u;
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.clearRect(0, 0, G.W, G.H);
  let shake = 0;
  if (G.shakeT > 0) { const k = (now - G.shakeT) / 380; if (k < 1) shake = Math.sin(k * 30) * (1 - k) * 10; else G.shakeT = -1; }
  ctx.translate(shake, 0);
  drawPauta(ctx);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const lvColor = LV_COLORS[G.lv];

  // Camí enfosquit (pista) + línia de punts al centre
  const trackW = Math.max(u * STROKE_W * 1.2, Math.min(G.tol * 1.6, u * 120));
  const ghostW = Math.max(4, u * STROKE_W);
  for (const st of m.strokes) {
    if (st.kind === 'dot') { dotAt(st.X[0], st.Y[0], trackW / 2, '#E8E1D4'); continue; }
    strokeRange(st, 0, st.len, '#E8E1D4', trackW);
  }
  // Lletra actual destacada
  if (!G.done) {
    const st = cur();
    if (st.kind === 'main') { const [a, b] = letterRange(); strokeRange(st, a, b, '#DCD1EC', trackW); }
    else if (st.kind === 'extra') strokeRange(st, 0, st.len, '#DCD1EC', trackW);
    else dotAt(st.X[0], st.Y[0], trackW / 2, '#DCD1EC');
  }
  // La paraula enfosquida, amb el gruix de la lletra de l'escola
  for (const st of m.strokes) {
    if (st.kind === 'dot') dotAt(st.X[0], st.Y[0], Math.max(4, u * 42), '#CFC5B4');
    else strokeRange(st, 0, st.len, '#CFC5B4', ghostW);
  }
  ctx.setLineDash([0.1, Math.max(8, u * 28)]);
  for (const st of m.strokes) { if (st.kind !== 'dot') strokeRange(st, 0, st.len, 'rgba(255,255,255,0.9)', Math.max(2.5, u * 12)); }
  ctx.setLineDash([]);

  // Errors que s'esvaeixen
  G.fails = G.fails.filter(f => now - f.t < 700);
  for (const f of G.fails) {
    const a = 1 - (now - f.t) / 700;
    ctx.globalAlpha = a;
    if (f.to > f.from) strokeRange(m.strokes[f.stroke], f.from, f.to, '#FF5A5F', G.ink);
    dotAt(f.x, f.y, G.tol * 0.5 * (1.5 - a), 'rgba(255,90,95,0.35)');
    ctx.globalAlpha = 1;
  }

  // Tinta: traços acabats i traç actual
  m.strokes.forEach((st, i) => {
    let to = 0;
    if (i < G.stroke || (G.done)) to = st.len; else if (i === G.stroke) to = G.s;
    if (i > G.stroke && !G.done) return;
    if (st.kind === 'dot') { if (i < G.stroke || G.done) dotAt(st.X[0], st.Y[0], Math.max(5, u * 44), lvColor); return; }
    if (to > 0) strokeRange(st, 0, to, lvColor, G.ink);
  });

  // Marcador d'inici / punta del llapis
  if (!G.done) {
    const st = cur();
    const p = pointAt(st, G.s);
    if (G.drawing) {
      dotAt(p[0], p[1], G.ink * 0.95, '#fff');
      dotAt(p[0], p[1], G.ink * 0.7, lvColor);
    } else {
      const hint = G.hintT > 0 && now - G.hintT < 600 ? 1 + 0.5 * Math.sin((now - G.hintT) / 600 * Math.PI) : 1;
      const r = Math.max(14, G.tol * 0.55) * (1 + 0.12 * Math.sin(now / 220)) * hint;
      ctx.beginPath(); ctx.arc(p[0], p[1], r * 1.5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(47,191,113,0.18)'; ctx.fill();
      dotAt(p[0], p[1], r, '#2FBF71');
      dotAt(p[0], p[1], r * 0.4, '#fff');
      if (st.kind !== 'dot') {
        const q = pointAt(st, Math.min(st.len, G.s + Math.max(r * 2.6, u * 93)));
        const ang = Math.atan2(q[1] - p[1], q[0] - p[0]);
        drawArrow(p[0] + Math.cos(ang) * r * 2.1, p[1] + Math.sin(ang) * r * 2.1, ang, r * 0.75, '#2FBF71');
      }
      // Demostració del recorregut si el nen dubta
      if (now - G.idleSince > 2500 && st.kind !== 'dot') {
        const [a, b] = st.kind === 'main' ? letterRange() : [0, st.len];
        const dur = Math.max(1200, (b - G.s) * 4);
        const ph = ((now - G.idleSince - 2500) % (dur + 500)) / dur;
        if (ph <= 1) {
          const t = G.s + (b - G.s) * ph;
          const g = pointAt(st, t);
          ctx.globalAlpha = 0.55;
          strokeRange(st, G.s, t, lvColor, G.ink * 0.5);
          dotAt(g[0], g[1], G.ink * 0.8, lvColor);
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  // Confeti
  G.confetti = G.confetti.filter(c => c.life > 0);
  for (const c of G.confetti) {
    c.vy += 0.25; c.x += c.vx; c.y += c.vy; c.rot += c.vr; c.life--;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color; ctx.globalAlpha = Math.min(1, c.life / 30);
    ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); ctx.restore();
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(render);

/* =====================================================================
   8. RECOMPENSES, AVISOS I MENÚ
   ===================================================================== */
let toastTimer = 0;
function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

function burst() {
  const cols = LV_COLORS.concat(['#FFD166']);
  for (let i = 0; i < 120; i++) {
    G.confetti.push({ x: G.W / 2 + (Math.random() - 0.5) * G.W * 0.5, y: G.H * 0.45, vx: (Math.random() - 0.5) * 16,
      vy: -Math.random() * 16 - 4, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4,
      s: 10 + Math.random() * 12, color: cols[i % cols.length], life: 90 + Math.random() * 50 });
  }
}

function starsFor(errors) { return errors === 0 ? 3 : errors <= 2 ? 2 : 1; }
function starsHTML(n) { return '<div class="stars">' + [1, 2, 3].map(i => i <= n ? '⭐' : '<span class="off">⭐</span>').join('') + '</div>'; }

let advanceTimer = 0;
function wordDone() {
  G.done = true;
  const w = G.model.word, st = starsFor(G.errors);
  save.best[w] = Math.max(save.best[w] || 0, st); persist();
  renderDots();
  burst();
  void pic.offsetWidth; pic.classList.add('bounce');
  const msgs = ['Molt bé!', 'Fantàstic!', 'Genial!', 'Ho has fet!', 'Bravo!'];
  showToast(msgs[Math.floor(Math.random() * msgs.length)] + '  ' + '⭐'.repeat(st));
  clearTimeout(advanceTimer);
  advanceTimer = setTimeout(() => { if (G.done && !$('#game').classList.contains('hidden') && $('#modal').classList.contains('hidden')) nextWord(); }, 2200);
}

function modal(html, buttons) {
  const box = $('#modal-box');
  box.innerHTML = html;
  const row = document.createElement('div'); row.className = 'row';
  for (const [label, fn, alt] of buttons) {
    const b = document.createElement('button'); b.className = 'big-btn' + (alt ? ' alt' : '');
    b.textContent = label; b.onclick = () => { closeModal(); fn(); };
    row.appendChild(b);
  }
  box.appendChild(row);
  $('#modal').classList.remove('hidden');
}
function closeModal() { $('#modal').classList.add('hidden'); }

function levelUp(nl) {
  const prev = G.lv;
  const total = LEVELS[prev].words.reduce((a, [w]) => a + (save.best[w] || 0), 0);
  modal(`<div class="modal-emo">${LEVELS[nl].words[0][1]}</div>
    <h2>Nivell ${prev + 1} superat!</h2>
    <p>Has aconseguit ${total} ⭐</p>
    <p>Ara ve el <b style="color:${LV_COLORS[nl]}">nivell ${nl + 1}</b>: paraules de ${LEVELS[nl].sub}.</p>`,
    [['Som-hi!', () => loadWord(nl, 0)], ['Menú', showMenu, true]]);
}
function finishAll() {
  modal(`<div class="modal-emo">🏆</div><h2>Ho has aconseguit!</h2><p>Has escrit totes les paraules en lletra lligada.</p>`,
    [['Menú', showMenu]]);
}

function showGame(lv, wi) {
  $('#menu').classList.add('hidden'); $('#game').classList.remove('hidden');
  loadWord(lv, wi);
}
function showMenu() {
  clearTimeout(advanceTimer);
  $('#game').classList.add('hidden'); $('#menu').classList.remove('hidden');
  buildMenu();
}

function buildMenu() {
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const c = document.createElement('button'); c.className = 'lv-card';
    const prog = L.words.map(([w]) => `<i style="${save.best[w] ? 'background:' + LV_COLORS[i] : ''}"></i>`).join('');
    c.innerHTML = `<div class="lv-num" style="background:${LV_COLORS[i]}">${i + 1}</div>
      <div class="lv-name">Nivell ${i + 1}</div><div class="lv-sub">${L.sub}</div>
      <div class="lv-emo">${L.words.slice(0, 3).map(w => w[1]).join('')}</div><div class="lv-prog">${prog}</div>`;
    c.onclick = () => {
      const first = L.words.findIndex(([w]) => !save.best[w]);
      showGame(i, first < 0 ? 0 : first);
    };
    box.appendChild(c);
  });
  document.querySelectorAll('#diff button').forEach(b => b.classList.toggle('on', b.dataset.d === save.diff));
  const ms = $('#menu-settings'); ms.innerHTML = ''; ms.appendChild(settingsControls());
  drawTitle();
}

function drawTitle() {
  const c = $('#title-cv'), r = c.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const words = ['lletra', 'lligada'].map(wordModel);
  const gap = 250;
  const totalW = words.reduce((a, m) => a + (m.maxX - m.minX), 0) + gap;
  const u = Math.min((r.width * 0.95) / totalW, r.height / (V_TOP - V_BOT));
  let ox = (r.width - totalW * u) / 2;
  const oy = (r.height - (V_TOP - V_BOT) * u) / 2 + V_TOP * u;
  x.lineCap = 'round'; x.lineJoin = 'round';
  words.forEach((m, wi) => {
    const col = wi ? '#9B5DE5' : '#FF6B6B';
    m.strokes.forEach(st => {
      layoutStroke(st, u, ox - m.minX * u, oy);
      if (st.kind === 'dot') { x.beginPath(); x.arc(st.X[0], st.Y[0], u * 44, 0, 7); x.fillStyle = col; x.fill(); return; }
      x.beginPath(); tracePath(x, st, 0, st.len); x.strokeStyle = col; x.lineWidth = Math.max(3, u * STROKE_W); x.stroke();
    });
    ox += (m.maxX - m.minX + gap) * u;
  });
}

/* Botons */
$('#btn-home').onclick = showMenu;
$('#btn-redo').onclick = () => loadWord(G.lv, G.wi);
$('#btn-next').onclick = () => { clearTimeout(advanceTimer); nextWord(); };
$('#btn-prev').onclick = () => { clearTimeout(advanceTimer); prevWord(); };
$('#btn-continue').onclick = () => {
  const p = save.pos || { lv: 0, i: 0 };
  const lv = Math.min(Math.max(0, p.lv | 0), LEVELS.length - 1);
  showGame(lv, Math.min(Math.max(0, p.i | 0), LEVELS[lv].words.length - 1));
};
document.querySelectorAll('#diff button').forEach(b => b.onclick = () => { save.diff = b.dataset.d; persist(); buildMenu(); });
$('#btn-reset').onclick = () => {
  modal('<h2>Esborrar el progrés?</h2><p>Es perdran totes les estrelles guardades en aquest dispositiu.</p>',
    [['Sí, esborra', () => { save.best = {}; save.pos = { lv: 0, i: 0 }; persist(); buildMenu(); }], ['No', () => {}, true]]);
};

/* Controls de mida (menú i finestra de configuració del joc) */
function applySettings() {
  persist();
  document.documentElement.style.setProperty('--z', zoomK());
  if (!$('#game').classList.contains('hidden')) resize(); else drawTitle();
}
function settingsControls() {
  const box = document.createElement('div'); box.className = 'settings';
  const r1 = document.createElement('div'); r1.className = 'row';
  r1.innerHTML = '<span class="lbl">Pantalla:</span>';
  const seg = document.createElement('div'); seg.className = 'seg';
  for (const [k, sc] of Object.entries(SCREENS)) {
    const b = document.createElement('button');
    b.textContent = `${sc.name} (${String(sc.inch).replace('.', ',')}")`;
    b.classList.toggle('on', save.screen === k);
    b.onclick = () => { save.screen = k; applySettings(); box.replaceWith(settingsControls()); };
    seg.appendChild(b);
  }
  r1.appendChild(seg);
  const r2 = document.createElement('div'); r2.className = 'row';
  r2.innerHTML = '<span class="lbl">Mida:</span>';
  const st = document.createElement('div'); st.className = 'stepper';
  const minus = document.createElement('button'), plus = document.createElement('button'), val = document.createElement('span');
  minus.textContent = '−'; plus.textContent = '+'; minus.setAttribute('aria-label', 'Més petit'); plus.setAttribute('aria-label', 'Més gran');
  const upd = () => { val.textContent = save.zoom + '%'; minus.disabled = save.zoom <= ZOOM_MIN; plus.disabled = save.zoom >= ZOOM_MAX; };
  minus.onclick = () => { save.zoom = Math.max(ZOOM_MIN, save.zoom - ZOOM_STEP); upd(); applySettings(); };
  plus.onclick = () => { save.zoom = Math.min(ZOOM_MAX, save.zoom + ZOOM_STEP); upd(); applySettings(); };
  upd(); st.append(minus, val, plus); r2.appendChild(st);
  box.append(r1, r2);
  return box;
}
$('#btn-size').onclick = () => {
  modal('<h2>Mida del joc</h2><p>100% és la mida recomanada per a cada pantalla.</p>', [['Fet', () => {}]]);
  const box = $('#modal-box'); box.insertBefore(settingsControls(), box.lastChild);
};
document.documentElement.style.setProperty('--z', zoomK());

window.addEventListener('resize', () => { if (!$('#game').classList.contains('hidden')) resize(); else drawTitle(); });
document.addEventListener('contextmenu', e => e.preventDefault());

// Accés per a proves
window.LletraLligada = { LEVELS, GL, wordModel, layoutStroke, G, loadWord, showGame };

buildMenu();
})();
</script>
